<footer class="site-footer">
    <div class="footer-brand">
        <a class="footer-brand-link no-underline" href="{{ '/' | relative_url }}">
            {%- include logo-icon.html -%}
            <span class="footer-brand-name">{{ site.title }}</span>
        </a>
    </div>
    <div class="footer-links">
        <div class="install-app-wrap" hidden><button type="button" class="install-app">Uygulamayı yükle</button></div>
        {%- if jekyll.environment == "production" and site.google_analytics %}
        <div><button type="button" class="cookie-settings">Çerez tercihleri</button></div>
        {%- endif %}
        <a class="footer-privacy" href="{{ '/gizlilik/' | relative_url }}">Gizlilik ve çerezler</a>
    </div>
    <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
</footer>
