title: Satranç Kahvesi
description: Kahve eşliğinde satranç sohbetleri
lang: tr
# The logo is the publisher logo in the structured data.
logo: /assets/img/icon-512.png
# Link previews (WhatsApp etc.): a small square logo (under 300 px wide), which WhatsApp shows as a horizontal card with
# the image on the left and the title and text on the right. A bigger image makes it a vertical card.
twitter:
  card: summary
baseurl: ""
url: "https://satranckahvesi.com"
google_analytics: G-EQR45VG5M7

markdown: kramdown
permalink: /posts/:title/
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - docs/
  - satranca-ilk-adim/
  - tests/
  - README.md
  - scripts/
  - vendor/
  - node_modules/

# Leading chess titles that are not part of a person's name (author initials).
chess_titles: [FM, GM, IM, CM, WFM, WGM, WIM, WCM, NM, AGM, AIM]

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/icon-192.png
        width: 192
        height: 192
        alt: Satranç Kahvesi logosu
